name: PR Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# The review posts as github-actions[bot] with the workflow token. Comments
# made with this token do not start workflows, so the bot cannot start itself.
permissions:
  contents: read
  pull-requests: write
  # PR conversation comments and reactions use the Issues API.
  issues: write

# The repo is public, so this runs on hosted runners, which are free for
# public repos. A self-hosted runner would run code from any fork PR.
jobs:
  review:
    # Only the owner's PRs and the owner's /review comments start a review.
    # Anyone can comment on a public repo.
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.user.login == github.repository_owner &&
        github.event.comment.user.login == github.repository_owner &&
        (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review '))) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.user.login == github.repository_owner &&
        github.event.comment.user.login == github.repository_owner &&
        (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review ')))
    # Job-level so a comment run that the if skips does not cancel a review in progress.
    concurrency:
      group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A comment event checks out main here. The OpenCode action then checks out
      # the PR branch itself. The agents run `git diff pr-base...HEAD`, so pr-base
      # is the base branch of the PR, and a stacked PR gets a review of its own
      # commits only. A comment event has no base branch in its payload, so gh
      # reads it for every event.
      - name: Create local pr-base
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          base=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          git branch --force pr-base "origin/$base"
      - uses: anomalyco/opencode/github@v1.18.32
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/muse-spark-1.3-contributor
          agent: pr-review
          mentions: /review
          share: false
          use_github_token: true
          # The action turns a PR conversation comment that is only /review into
          # "Summarize this thread", so that case gets a review prompt. An empty
          # prompt keeps the action's own prompt. A bare /review on a diff line
          # keeps it on purpose: it reviews the commented lines.
          prompt: ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/review' && 'Review this pull request' || '' }}
